[project]
name = "comfyui-soda-prompt-library"
version = "0.3.0"
description = "Local prompt browsing, composition and editable snapshots for ComfyUI"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.urls]
Repository = "https://github.com/cOkieeman/ComfyUI-Soda-Prompt-Library"

[tool.comfy]
PublisherId = "cokieeman"
DisplayName = "Soda Prompt Library"
Icon = ""
includes = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "aiohttp>=3.14.5",
    "ruff>=0.17.3",
]
